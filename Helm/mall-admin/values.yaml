replicaCount: 1


image:
  repository: 192.168.0.198/mall/mall-admin
  tag: "v1"
  pullPolicy: IfNotPresent


imagePullSecrets:
  - name: harbor-secret


service:
  type: ClusterIP
  port: 8080


env:
  SPRING_PROFILES_ACTIVE: "prod"
  LOGSTASH_ENABLEINNERLOG: "true"


resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: "1"
    memory: 1Gi


autoscaling:
  enabled: true

  minReplicas: 1

  maxReplicas: 3

  targetCPUUtilizationPercentage: 70


livenessProbe:

  httpGet:
    path: /actuator/health/liveness
    port: http

  periodSeconds: 10

  timeoutSeconds: 2

  failureThreshold: 3


readinessProbe:

  httpGet:
    path: /actuator/health/readiness
    port: http

  periodSeconds: 5

  timeoutSeconds: 2

  failureThreshold: 3

  successThreshold: 1


startupProbe:

  httpGet:
    path: /actuator/health
    port: http

  periodSeconds: 5

  timeoutSeconds: 2

  failureThreshold: 12
