apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: qqmail-alertmanager
  namespace: mall-prod
  labels:
    alertmanagerConfig: qqmail
spec:
  route:
    receiver: qqmail
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: qqmail
      emailConfigs:
        - to: "2716915922@qq.com"
          from: "2716915922@qq.com"
          smarthost: "smtp.qq.com:465"
          authUsername: "2716915922@qq.com"
          authPassword:
            name: qqmail-smtp
            key: password
          requireTLS: true
