apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qqmail-test-rule
  namespace: mall-prod
  labels:
    release: monitoring
spec:
  groups:
    - name: qqmail-test
      rules:
        - alert: QQMailPrometheusTest
          expr: vector(1)
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "Prometheus QQ mail test"
            description: "Temporary test alert generated by Prometheus."
