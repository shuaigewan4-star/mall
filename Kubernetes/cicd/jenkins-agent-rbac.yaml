apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: jenkins-agent
  namespace: cicd

rules:

- apiGroups:
    - ""
  resources:
    - pods
    - pods/log
    - pods/exec
  verbs:
    - get
    - list
    - watch
    - create
    - delete
    - patch
    - update

- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - get
    - list
    - watch

- apiGroups:
    - ""
  resources:
    - events
  verbs:
    - get
    - list
    - watch
