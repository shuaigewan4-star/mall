apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: mall-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.75.0
          args:
            - "--redis.addr=redis://redis:6379"
          ports:
            - name: metrics
              containerPort: 9121
