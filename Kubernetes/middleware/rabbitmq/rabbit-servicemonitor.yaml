apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbit
  namespace: mall-prod
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: rabbit
  namespaceSelector:
    matchNames:
      - mall-prod
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
