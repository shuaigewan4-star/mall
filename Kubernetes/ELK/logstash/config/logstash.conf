input {

  tcp {
    port => 4560
    codec => json_lines
    type => "debug"
  }

  tcp {
    port => 4561
    codec => json_lines
    type => "error"
  }

  tcp {
    port => 4562
    codec => json_lines
    type => "business"
  }

  tcp {
    port => 4563
    codec => json_lines
    type => "record"
  }

}


output {

  elasticsearch {
    hosts => ["http://es:9200"]
    index => "mall-log-%{type}-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }

}
