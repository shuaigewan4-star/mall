apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-exporter-config
  namespace: mall-prod
data:
  config.yml: |
    logstash:
      instances:
        - url: "http://logstash:9600"
          name: "mall-logstash"
      timeout: 5s

    server:
      host: "0.0.0.0"
      port: 9198

    logging:
      level: "info"
