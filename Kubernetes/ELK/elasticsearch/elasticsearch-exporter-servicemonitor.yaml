apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: elasticsearch-exporter
  namespace: mall-prod
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: elasticsearch-exporter
  namespaceSelector:
    matchNames:
      - mall-prod
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
