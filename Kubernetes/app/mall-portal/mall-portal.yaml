apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-portal
  namespace: mall-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-portal
  template:
    metadata:
      labels:
        app: mall-portal
    spec:
      imagePullSecrets:
        - name: harbor-secret

      containers:
        - name: mall-portal
          image: 192.168.0.198/mall/mall-portal:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8085

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            - name: LOGSTASH_ENABLEINNERLOG
              value: "true"

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi


          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3


---
apiVersion: v1
kind: Service
metadata:
  name: mall-portal
  namespace: mall-prod
  labels:
    app: mall-portal
spec:
  type: ClusterIP
  selector:
    app: mall-portal
  ports:
    - name: http
      port: 8085
      targetPort: 8085
