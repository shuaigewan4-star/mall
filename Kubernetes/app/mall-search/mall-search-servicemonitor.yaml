apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mall-search
  namespace: mall-prod
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: mall-search

  namespaceSelector:
    matchNames:
      - mall-prod

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
