apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mall-app-web
  namespace: mall-prod
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: mall-app-web

  namespaceSelector:
    matchNames:
      - mall-prod

  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
